name: Publish

# Tag push (v0.1.0) -> PyPI.  Manual run -> TestPyPI rehearsal.
#
# Both jobs authenticate with PyPI via Trusted Publishing (OIDC), so there
# are no API tokens stored in this repo.  One-time setup on each index:
#   https://pypi.org/manage/account/publishing/
#     Owner: justinhardin   Repository: gridfinity-pic-to-bin
#     Workflow: publish.yml  Environment: pypi   (testpypi for TestPyPI)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      # The version lives in pic_to_bin/__init__.py and reaches the wheel
      # through hatchling, so compare the tag against what was actually built
      # rather than re-deriving it from source.
      - name: Check the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(python -c "import pathlib; print(next(pathlib.Path('dist').glob('*.whl')).name.split('-')[1])")
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match built version $built"
            exit 1
          fi

      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
