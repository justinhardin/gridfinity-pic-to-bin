<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pic-to-Bin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon-64.png">
  <link rel="stylesheet" href="/static/styles.css">
  <!--
    Lit is vendored locally in /static/lit-all.min.js (the official pinned
    lit/dist bundle) so the app has no third-party runtime dependency: it
    loads offline and under the server's strict Content-Security-Policy.

    Refresh / re-download the bundle with:
        python -m pic_to_bin.web.vendor_lit

    If that file is ever missing, the server rewrites this import map to the
    esm.sh CDN when it serves the page and widens the CSP to match, so the
    app still loads. Note the bundle has no `lit/decorators.js` export —
    app.js uses plain class fields and `static properties`.
  -->
  <script type="importmap">
    {
      "imports": {
        "lit": "/static/lit-all.min.js"
      }
    }
  </script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Pic-to-Bin</h1>
      <p>Phone-camera photos → printable Gridfinity bin</p>
    </div>
    <a class="home-nav-link" href="/">← Home</a>
  </header>
  <main>
    <pic-app></pic-app>
  </main>
</body>
</html>
