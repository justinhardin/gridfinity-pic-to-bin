[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gridfinity-pic-to-bin"
dynamic = ["version"]
description = "Generate 3D-printable gridfinity bins from phone photos with ArUco template"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [{ name = "Justin Hardin" }]
keywords = [
    "gridfinity",
    "3d-printing",
    "fusion-360",
    "aruco",
    "photogrammetry",
    "segmentation",
    "dxf",
    "cad",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Utilities",
]
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "svgpathtools",
    "ezdxf",
    "pyclipper",
    "matplotlib",
    "potracer",
    "pillow-heif",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/justinhardin/gridfinity-pic-to-bin"
Repository = "https://github.com/justinhardin/gridfinity-pic-to-bin"
Issues = "https://github.com/justinhardin/gridfinity-pic-to-bin/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
web = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sse-starlette",
    "anthropic",
    "python-dotenv",
]

[project.scripts]
pic-to-bin = "pic_to_bin.pipeline:main"
pic-to-bin-web = "pic_to_bin.web.server:cli"
generate-phone-template = "pic_to_bin.phone_template:main"
preprocess-phone = "pic_to_bin.phone_preprocess:main"
trace-tool = "pic_to_bin.trace_tool:main"
validate-trace = "pic_to_bin.validate_trace:main"
layout-tools = "pic_to_bin.layout_tools:main"
prepare-bin = "pic_to_bin.prepare_bin:main"
pic-to-bin-fusion = "pic_to_bin.fusion_install:main"

[tool.hatch.version]
path = "pic_to_bin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pic_to_bin"]

[tool.hatch.build.targets.sdist]
include = [
    "/pic_to_bin",
    "/tests",
    "/README.md",
    "/LICENSE.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
